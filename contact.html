    <!-- Styles and Css -->
    <style>
        /* fonts */
        @import url('https://fonts.googleapis.com/css2?family=Geologica:wght,CRSV@100..900,0&display=swap');

        .policycontent {
            max-width: 800px;
            margin: 0 auto;
            padding: 140px 0 100px;
            /* Clears fixed header space */
            line-height: 1.8;
            font-weight: 300;
        }

        .policycontent h1 {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .policycontent .updated {
            color: var(--secondarycolor);
            opacity: 0.6;
            margin-bottom: 40px;
        }

        .policycontent section {
            margin-bottom: 40px;
        }

        .policycontent h2 {
            font-size: 1.4rem;
            margin-bottom: 16px;
            color: var(--accentgreen);
        }

        .policycontent p {
            margin-bottom: 16px;
        }

        .policycontent strong {
            font-weight: 600;
            color: var(--white);
        }

        .contactlinks {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .contactlinks a {
            color: var(--accentgreen);
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .policycontent h1 {
                font-size: 2rem;
            }
        }
    </style>
    <link rel="stylesheet" href="style.css">
    <script defer src="autoload/autoload.js"></script>

    <div id="maincontainer">

                <div class="contactlinks">

                </div>
