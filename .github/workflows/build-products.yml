name: Build product listings

on:
  push:
    branches: [main]
    paths:
      - "data/products.json"
      - "autoload/products-render.js"
      - "scripts/build.js"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render products.json into the static pages
        run: node scripts/build.js

      - name: Commit and push if the pages changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html about.html privacy-policy.html
          if git diff --cached --quiet; then
            echo "No product content changes to commit."
          else
            git commit -m "chore: rebuild product listings from products.json [skip ci]"
            git push
          fi
